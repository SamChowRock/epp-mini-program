name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - run: pnpm install --frozen-lockfile
      - name: Build without deprecated options
        shell: bash
        run: |
          pnpm build 2>&1 | tee "$RUNNER_TEMP/epp-mini-build.log"
          ! grep -Ei 'deprecated|deprecation' "$RUNNER_TEMP/epp-mini-build.log"
      - run: pnpm test
